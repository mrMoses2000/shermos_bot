# Netlify build & routing config for Shermos CMS frontend.
# Backend API stays on Ubuntu — set VITE_API_BASE_URL in Netlify UI to point at it.

[build]
  base = "mini-app"
  command = "npm run build"
  publish = "mini-app/dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — all routes served by index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "interest-cohort=()"

# Long cache for hashed assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
